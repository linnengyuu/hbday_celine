<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Birthday</title>
<link rel="icon" type="image/jpeg" href="image/1.jpeg">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#2a1233;--bg2:#4a1d4f;--paper:#fff4f0;--ink:#3a1a3f;--rose:#ff7a9c;--flame:#ffb84d}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:"DM Sans",system-ui,sans-serif;color:var(--paper);background:radial-gradient(120% 90% at 50% 100%,var(--bg2),var(--bg));overflow-x:hidden;min-height:100vh}
main{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;text-align:center}
h1{font-family:Caveat,cursive;font-size:clamp(3rem,13vw,6rem);line-height:1;font-weight:700}
.sub{margin-top:10px;opacity:.85;min-height:1.5em}
.cake{margin:36px 0 12px;position:relative;width:260px}
.candles{display:flex;justify-content:center;gap:26px;height:70px;align-items:flex-end}
.candle{position:relative;width:14px;height:44px;background:repeating-linear-gradient(-45deg,var(--paper) 0 6px,var(--rose) 6px 12px);border-radius:3px;border:0;cursor:pointer;padding:0}
.candle:focus-visible{outline:3px solid var(--flame);outline-offset:6px}
.flame{position:absolute;left:50%;bottom:100%;width:14px;height:22px;margin-left:-7px;background:radial-gradient(circle at 50% 70%,#fff 0,var(--flame) 45%,#ff7a2e 100%);border-radius:50% 50% 50% 50%/65% 65% 35% 35%;transform-origin:50% 100%;animation:flick .5s ease-in-out infinite alternate;filter:drop-shadow(0 0 10px var(--flame));transition:opacity .25s,transform .25s}
.candle.out .flame{opacity:0;transform:scale(.2);animation:none}
@keyframes flick{to{transform:scale(1.08,.94) rotate(3deg)}}
.tier1{height:46px;background:var(--rose);border-radius:10px 10px 0 0}
.tier2{height:54px;background:var(--paper);border-radius:0 0 14px 14px;box-shadow:inset 0 14px 0 #ffd3dc}
.hint{font-size:.95rem;opacity:.8;margin-top:8px}
.msg{white-space:pre-wrap;overflow-wrap:anywhere}
.letter{max-width:560px;width:100%;margin-top:28px;padding:26px 24px;background:var(--paper);color:var(--ink);border-radius:6px;text-align:left;line-height:1.65;display:none;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.letter.show{display:block;animation:rise .8s ease both}
.letter h2{font-family:Caveat,cursive;font-size:2rem;margin-bottom:8px}
.letter ul{margin:14px 0 14px 1.1em}
.letter li{margin:6px 0}
.sign{font-family:Caveat,cursive;font-size:1.8rem;margin-top:10px;text-align:right}
@keyframes rise{from{opacity:0;transform:translateY(24px) rotate(-1deg)}to{opacity:1;transform:none}}
canvas{position:fixed;inset:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){.flame,.letter.show{animation:none}}
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>
  <div class="cake" aria-label="Birthday cake">
    <div class="candles" id="candles"></div>
    <div class="tier1"></div><div class="tier2"></div>
  </div>
  <p class="hint" id="hint">Tap each candle to blow it out.</p>
  <section class="letter" id="letter" aria-live="polite">
    <h2 id="lt"></h2>
    <p class="msg" id="lm"></p>
    <p class="sign" id="ls"></p>
  </section>
</main>
<canvas id="c"></canvas>

};


const $ = id => document.getElementById(id);
$("title").textContent = "Happy Birthday, " + CFG.name + "!";
$("sub").textContent = CFG.subtitle;
$("lt").textContent = CFG.letterTitle;
$("lt").hidden = !CFG.letterTitle;
$("lm").textContent = CFG.message.trim();
$("ls").textContent = CFG.signature;

$("ls").hidden = !CFG.signature;

const n = Math.min(Math.max(CFG.age, 1), 7);
let left = n;
for (let i = 0; i < n; i++) {
  const b = document.createElement("button");
  b.className = "candle"; b.setAttribute("aria-label", "Blow out candle " + (i + 1));
  b.innerHTML = '<span class="flame"></span>';
  b.addEventListener("click", () => {
    if (b.classList.contains("out")) return;
    b.classList.add("out");
    if (--left === 0) celebrate();
  });
  $("candles").appendChild(b);
}

const cv = $("c"), ctx = cv.getContext("2d");
let parts = [];
function size(){ cv.width = innerWidth; cv.height = innerHeight; }
addEventListener("resize", size); size();
function celebrate(){
  $("hint").textContent = "Your wish is on its way.";
  $("letter").classList.add("show");
  $("letter").scrollIntoView({behavior: matchMedia("(prefers-reduced-motion:reduce)").matches ? "auto" : "smooth", block: "start"});
  if (matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  const cols = ["#ff7a9c","#ffb84d","#fff4f0","#b48cff","#7fe3d0"];
  for (let i = 0; i < 140; i++) parts.push({x: innerWidth/2, y: innerHeight/3, vx: (Math.random()-.5)*12, vy: -Math.random()*12-3, s: Math.random()*7+4, r: Math.random()*6, c: cols[i % cols.length], life: 260});
  requestAnimationFrame(tick);
}
function tick(){
  ctx.clearRect(0, 0, cv.width, cv.height);
  parts = parts.filter(p => p.life-- > 0);
  parts.forEach(p => { p.vy += .25; p.x += p.vx; p.y += p.vy; p.r += .15; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.globalAlpha = Math.min(1, p.life/60); ctx.fillStyle = p.c; ctx.fillRect(-p.s/2, -p.s/4, p.s, p.s/2); ctx.restore(); });
  if (parts.length) requestAnimationFrame(tick);
}
</script>
